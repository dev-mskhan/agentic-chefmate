services:
  # ─── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: chefmate-mongo
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - chefmate

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chefmate-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - chefmate

  # ─── Redpanda (Kafka-compatible) ───────────────────────────────────────────
  # Two listeners:
  #   PLAINTEXT (port 9092)  — advertised as localhost:9092  → for host machine (Node.js services)
  #   INTERNAL  (port 29092) — advertised as redpanda:29092  → for Docker containers (Console, etc.)
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: chefmate-redpanda
    restart: unless-stopped
    ports:
      - '9092:9092'    # host access (Node.js services on your machine)
      - '29092:29092'  # internal Docker network access
      - '9644:9644'    # Admin API
      - '8081:8081'    # Schema Registry
      - '8082:8082'    # HTTP Proxy
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092,INTERNAL://redpanda:29092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - chefmate
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -E "Healthy|true"']
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Redpanda Console ────────────────────────────────────────────────────────
  redpanda-console:
    image: redpandadata/console:latest
    container_name: chefmate-redpanda-console
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # Use the INTERNAL listener — console runs inside Docker network
      KAFKA_BROKERS: redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - chefmate

  # ─── Review Service ─────────────────────────────────────────────────────────
  review-service:
    build:
      context: ..
      dockerfile: services/review-service/Dockerfile
    container_name: chefmate-review-service
    restart: unless-stopped
    env_file:
      - ../services/review-service/.env
    ports:
      - '3010:3010'
    depends_on:
      - mongo
      - redpanda
    networks:
      - chefmate

  # ─── Chat Service ────────────────────────────────────────────────────────────
  chat-service:
    build:
      context: ..
      dockerfile: services/chat-service/Dockerfile
    container_name: chefmate-chat-service
    restart: unless-stopped
    env_file:
      - ../services/chat-service/.env
    ports:
      - '3011:3011'
    depends_on:
      - mongo
      - redis
      - redpanda
    networks:
      - chefmate

  # ─── Payout Service ─────────────────────────────────────────────────────────
  payout-service:
    build:
      context: ..
      dockerfile: services/payout-service/Dockerfile
    container_name: chefmate-payout-service
    restart: unless-stopped
    env_file:
      - ../services/payout-service/.env
    ports:
      - '3012:3012'
    depends_on:
      - mongo
      - redis
      - redpanda
    networks:
      - chefmate

  # ─── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:    image: minio/minio
    container_name: chefmate-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ../.env
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # MinIO Console
    volumes:
      - minio_data:/data
    networks:
      - chefmate

volumes:
  mongo_data:
  redis_data:
  redpanda_data:
  minio_data:

networks:
  chefmate:
    driver: bridge
